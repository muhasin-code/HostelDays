{% extends "base.html" %}

{% block content %}
<div class="app-wrapper" style="margin: -2rem;">
    <aside class="sidebar glass" style="border-radius: 0; border-top: none; border-bottom: none; border-left: none;">
        <a href="{{ url_for('user.index') }}" class="logo">
            <i data-lucide="home"></i>
            HostelDays
        </a>
        
        <nav style="flex: 1;">
            {% block sidebar_nav %}{% endblock %}
        </nav>

        <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid var(--border);">
            <a href="{{ url_for('user.logout') }}" class="nav-link" style="color: #ef4444;">
                <i data-lucide="log-out"></i>
                Sign Out
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem;">
            <div>
                <h1 style="margin-bottom: 0.25rem;">{% block page_title %}{% endblock %}</h1>
                <p style="color: var(--text-muted);">{% block page_subtitle %}{% endblock %}</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                {% block header_actions %}{% endblock %}
            </div>
        </header>

        {% block dashboard_content %}{% endblock %}
    </main>
</div>
{% endblock %}
