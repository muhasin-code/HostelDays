{% extends "base.html" %}
{% block title %}Register Warden - HostelDays{% endblock %}
{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card glass" style="width: 100%; max-width: 500px; padding: 3.5rem;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div style="background: rgba(79, 70, 229, 0.1); width: 4rem; height: 4rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: var(--primary);">
                <i data-lucide="shield-check" style="width: 2rem; height: 2rem;"></i>
            </div>
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Warden Signup</h1>
            <p style="color: var(--text-muted);">Create your warden account</p>
        </div>

        <form method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label for="unique_id">Hostel Unique Key</label>
                <div style="position: relative;">
                    <i data-lucide="key" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 1.25rem; height: 1.25rem; color: var(--text-muted);"></i>
                    <input type="text" id="unique_id" name="unique_id" placeholder="Enter assigned hostel key" style="padding-left: 3rem;" required>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 2.5rem;">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                Create Account
            </button>
        </form>

        <div style="margin-top: 2rem; text-align: center;">
            <p style="font-size: 0.875rem; color: var(--text-muted);">Already have an account? <a href="{{ url_for('user.login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
