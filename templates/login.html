{% extends "base.html" %}
{% block title %}Login - HostelDays{% endblock %}
{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card glass" style="width: 100%; max-width: 450px; padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <div style="background: rgba(79, 70, 229, 0.1); width: 4rem; height: 4rem; border-radius: 1rem; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: var(--primary);">
                <i data-lucide="lock" style="width: 2rem; height: 2rem;"></i>
            </div>
            <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h1>
            <p style="color: var(--text-muted);">Please enter your details to login</p>
        </div>

        <form method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <div style="position: relative;">
                    <i data-lucide="user" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 1.25rem; height: 1.25rem; color: var(--text-muted);"></i>
                    <input type="text" id="username" name="username" placeholder="Enter your username" style="padding-left: 3rem;" required>
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password">Password</label>
                <div style="position: relative;">
                    <i data-lucide="key-round" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); width: 1.25rem; height: 1.25rem; color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" placeholder="••••••••" style="padding-left: 3rem;" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">
                Sign In
            </button>
        </form>

        <div style="margin-top: 2rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
            Don't have an account? <br>
            <div style="margin-top: 1rem; display: flex; gap: 1rem; justify-content: center;">
                <a href="{{ url_for('user.register_student') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Student signup</a>
                <span style="color: var(--border);">|</span>
                <a href="{{ url_for('user.register_warden') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Warden signup</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
